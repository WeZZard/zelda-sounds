name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Re-run tag + release + dispatch (e.g. v2.0.6)
        required: true
        type: string
      version:
        description: Plugin version without v prefix (optional; derived from tag)
        required: false
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'WeZZard/zelda-sounds'
    uses: WeZZard/workflows/.github/workflows/release-plugin.yml@v1.0.0
    with:
      plugin_name: zelda-sounds
      version_file: canonical/manifest.json
      release_title_prefix: Zelda Sounds
      source_repo: WeZZard/zelda-sounds
      pre_validate_command: npm ci && node build.mjs
      event_name: ${{ github.event_name }}
      dispatch_tag: ${{ github.event.inputs.tag }}
      dispatch_version: ${{ github.event.inputs.version }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.ZELDA_SOUNDS_RELEASE_TOKEN }}
